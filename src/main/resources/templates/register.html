<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | LibraryAPI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #7794c2 100%);
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
        }

        .card-header {
            background: transparent;
            border: none;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .card-header h2 {
            font-weight: 800;
            color: #2b2d42;
            letter-spacing: -1px;
        }

        .input-group {
            background: #f8f9fa;
            border-radius: 12px;
            border: 1.5px solid #eee;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .input-group:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);
        }

        .input-group-text {
            background: transparent;
            border: none;
            padding-left: 1rem;
            color: #adb5bd;
        }

        .form-control {
            border: none !important;
            background: transparent !important;
            padding: 0.8rem 0.5rem;
            box-shadow: none !important;
        }

        .btn-primary {
            background: var(--primary-color);
            border: none;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: var(--secondary-color);
            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.3);
        }

        .extra-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .extra-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="card-header">
        <i class="bi bi-person-plus-fill" style="font-size: 2.5rem; color: var(--primary-color);"></i>
        <h2 class="mt-3">Crie sua conta</h2>
        <p class="text-muted">Cadastre-se e faça parte da nossa biblioteca digital</p>
    </div>

    <div th:if="${error}" class="alert alert-danger border-0 mb-4" role="alert" style="border-radius: 12px;">
        <i class="bi bi-exclamation-circle me-2"></i>
        <span th:text="${error}">Erro ao cadastrar.</span>
    </div>

    <form th:action="@{/users}" th:object="${userDTO}" method="post">

        <div class="mb-3">
            <label class="form-label text-muted small fw-bold">E-mail</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" name="email" placeholder="exemplo@link.com" required>
            </div>
            <div class="text-danger small mt-1" th:if="${#fields?.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label text-muted small fw-bold">Senha</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" name="password" placeholder="Sua senha" required>
            </div>
        </div>

        <div class="d-grid mb-3">
            <button class="btn btn-primary" type="submit">Criar Conta</button>
        </div>
    </form>

    <div class="extra-links">
        <p>Já possui uma conta? <a th:href="@{/login}">Fazer login</a></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
